summary: 用 Docker 编排整套 SpringCloud 微服务商城：Nacos 注册与配置中心、Sentinel 流控熔断、Seata 分布式事务、RabbitMQ 消息与延迟队列、Redis 分片集群、Elasticsearch 商品检索。

description: |
  【待填】建议补：
  - 商城有哪些业务模块（截图里能看到购物车、商品、用户服务）
  - 容器编排怎么组织的（compose 分了几个网络/数据卷、启动顺序）
  - 遇到的具体问题（比如某个组件先起后起导致注册失败之类）

highlights:
  # 以下四条都能在截图里看到
  - Redis 分片集群 9 节点 3 主 6 从，主从复制状态 online
  - Nacos 作为配置中心集中管理 10 条共享配置（数据源 / Redis / 日志 / 网关路由等）
  - Sentinel 接入商品服务的簇点链路，配置流控、熔断、热点规则
  - RabbitMQ 声明延迟队列与死信交换机，承载支付、交易等异步流程

