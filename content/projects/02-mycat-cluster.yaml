summary: 用 Mycat 按 id 取模把写入水平拆到两个主库，每个分片再配一台备用主库和各带一个从库，合计 8 个 MySQL 节点；主库故障时备用主库接管写入。

description: |
  整套集群分两层：Mycat 在前面做分片路由和读写分离，后面是两组 MySQL 主从。

  写入按 id % 2 水平分表落到 Master1 / Master2。每个分片是一主一备的结构：
  Master1 配备用主库 Master11，两台再各带一个从库（Slave1 / Slave11）。
  两个分片合计 8 个 MySQL 节点，加 Mycat 一共 9 台机器。

  Master1 与 Master2 只接受写入，其余 6 个节点（两台备用主库 + 四个从库）
  全部只承接读 —— 写集中在两台、读摊到六台。
  主库挂掉时，Master11 接替 Master1、Master22 接替 Master2 执行写操作。

  Mycat 侧通过 schema.xml 声明四组 dataHost，balance="1" 让读请求在
  各读库之间随机分发，switchType="1" 打开主库故障自动切换。

highlights:
  # 以下每一条都能在手写架构图或 schema.xml 里找到出处
  - 水平分表：写入按 id % 2 路由到 Master1 与 Master2，避免单主库数据量过大拖慢性能
  - 每个分片「二主二从」：Master1 配 Master11、Master2 配 Master22，两台再各带一个从库
  - 共 8 个 MySQL 节点 + 1 个 Mycat，分两个分片各 4 节点
  - 读写分离：只有 Master1 / Master2 接受写入，其余 6 个节点（备用主库 + 从库）全部只读
  - 故障接管：Master1 挂掉由 Master11 接替写、Master2 挂掉由 Master22 接替写
  - 配置为 balance="1" 读写分离模式，Mycat 在提供读的节点之间随机分发请求
  - 用 Mycat-eye 监控 SQL 读写次数与响应时间分布

