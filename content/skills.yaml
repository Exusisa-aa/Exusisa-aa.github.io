# 技能分组 —— 每组渲染成一张玻璃卡片
# accent 是这张卡片的强调色（编号、hover 发光线），不填则跟随当前分镜主题色

groups:
  - id: java-backend
    title: Java 后端
    accent: "#7aa2ff"
    level: 主力方向
    items:
      - name: Java 基础
        keywords: [动态代理, 反射, 多线程]
      - name: Web 接口开发
        keywords: [MyBatis / MyBatis-Plus, SpringBoot, Maven, RESTful, 去 SQL 化]
      - name: Spring 生态
        keywords: [SpringMVC, SpringAOP, Spring 事务, MP 锁]
      - name: 微服务
        keywords:
          - api-biz-dto 拆分
          - 微服务网关与登录拦截
          - Nacos 注册中心与配置热更新
          - OpenFeign 服务间调用
          - Sentinel 流控隔离熔断
          - Seata 分布式事务 XA / AT
          - RabbitMQ 消息与死信延迟
          - Elasticsearch DSL 查询优化
      - name: 第三方能力
        keywords: [阿里云 OSS 存储, JWT 令牌生成与解析, 百度云人脸识别]

  - id: database
    title: 数据库
    accent: "#4fe0c8"
    level: 主力方向
    items:
      - name: SQL 能力
        keywords: [多表关联, 视图, 联合索引, SQL 性能分析]
      - name: 底层原理
        keywords: [ES 倒排索引, Seata AT 的 undo_log, 数据库重启后的 redo_log]
      - name: 集群架构
        keywords: [分库分表, 主从复制, 读写分离, Mycat, Mycat-web 监控]
      - name: 缓存
        keywords: [Redis 基础作用, Redis 读写操作]

  - id: ai
    title: AI 与 Agent
    accent: "#a58cff"
    level: 重点方向
    items:
      - name: 本地大模型
        keywords: [Ollama 本地部署, DeepSeek, 千问向量嵌入模型]
      - name: RAG 智能体
        keywords:
          - LangChain 基础库
          - LangGraph 流程控制
          - PostgreSQL
          - FastAPI 后端
          - Chroma 向量数据库
          - 动态提示词替换
          - REACT 智能体
      - name: Agent 工作流
        keywords: [ClaudeCode, Codex, Skills 控制输出质量, 多 Agent 协作, 自动化工作流]
      - name: 计算机视觉
        keywords: [Ultralytics, YOLO 模型训练, 模型打包与部署]

  - id: devops
    title: 部署与运维
    accent: "#5fc8e8"
    level: 熟练
    items:
      - name: 容器化
        keywords: [Docker, Dockerfile, Docker-Compose, Nginx / MySQL / Nacos 镜像]
      - name: Linux
        keywords: [Ubuntu, 常用命令, Vim, 防火墙操作, FinalShell]
      - name: 版本控制
        keywords: [Git, GitHub 代码仓库]

  - id: frontend
    title: 前端
    accent: "#ffab7c"
    level: 熟练
    items:
      - name: 基础
        keywords: [HTML5, CSS3, JavaScript]
      - name: 框架
        keywords: [Vue2, Vue3, Axios, Pinia 数据持久化]
      - name: 工程化
        keywords: [Node.js, Vite, webpack, NPM / PNPM / YARN, ESLint 规范化, Husky 代码检查]
      - name: 组件与场景
        keywords:
          - VantUI / ElementPlus
          - Swiper
          - WangEditor / QuillEditor
          - ECharts
          - Bootstrap 栅格
          - 移动端网页
          - ArkUI 鸿蒙
          - 微信小程序
